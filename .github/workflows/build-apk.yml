name: Build Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Release APK
      run: |
        set -o pipefail
        ./gradlew assembleRelease --stacktrace 2>&1 | tee noorix-build.log

    - name: Annotate failure (temporary diagnostic)
      if: failure()
      run: |
        # Workflow commands do not need a write token: each line below
        # becomes a check-run annotation on this job.
        # First: everything from the FAILURE marker to the end (the
        # "What went wrong" + "Caused by" sections), capped at 30 lines.
        awk '/^FAILURE: Build failed/{f=1} f' noorix-build.log | head -n 30 | while IFS= read -r line || [ -n "$line" ]; do
          printf '::error file=gradlew,line=1,title=Noorix CI error::%s\n' "$line"
        done
        # Second: the last 10 lines (stack trace context).
        tail -n 10 noorix-build.log | while IFS= read -r line || [ -n "$line" ]; do
          printf '::error file=gradlew,line=2,title=Noorix CI log tail::%s\n' "$line"
        done

    - name: Push failure log (temporary diagnostic)
      if: failure()
      env:
        LOG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        LOG_BRANCH="ci-log/run-${GITHUB_RUN_ID}"
        LOG_DIR="/tmp/noorix-logpush"
        rm -rf "$LOG_DIR"
        mkdir -p "$LOG_DIR"
        git config --global user.email "ci@noorix.local"
        git config --global user.name "Noorix CI"
        git -C "$LOG_DIR" init -q
        git -C "$LOG_DIR" checkout -q -b noorix-cilog
        cp noorix-build.log "$LOG_DIR/build-failure.log"
        echo "run=${GITHUB_RUN_ID}" > "$LOG_DIR/meta.txt"
        echo "sha=${GITHUB_SHA}" >> "$LOG_DIR/meta.txt"
        echo "ref=${GITHUB_REF}" >> "$LOG_DIR/meta.txt"
        git -C "$LOG_DIR" add -A
        git -C "$LOG_DIR" commit -qm "CI failure log for run ${GITHUB_RUN_ID}"
        git -C "$LOG_DIR" push -q -f "https://x-access-token:${LOG_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${LOG_BRANCH}" || echo "NOORIX-HOOK: push of CI failure log failed (token lacks write)"

    - name: Upload Release APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk
