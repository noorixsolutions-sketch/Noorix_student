name: Build Debug APK
on:
  push:
    branches: ["arena/01a0824a-noorix-student"]
  workflow_dispatch: {}
concurrency:
  group: apk-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Accept SDK licenses and install packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build debug APK
        run: |
          mkdir -p ci
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ci/build.log
      - name: Generate Gradle wrapper (for future local builds)
        if: always()
        run: gradle wrapper --gradle-version 9.3.1 --no-daemon || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Noorix-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            ci/build.log
          if-no-files-found: warn
      - name: Commit APK and build log back to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Keep the committed log slim (last 1500 lines)
          if [ -f ci/build.log ]; then
            tail -n 1500 ci/build.log > ci/build-tail.log
            rm -f ci/build.log
          else
            echo "no build log produced" > ci/build-tail.log
          fi
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1 || true)
          if [ -n "$APK" ]; then
            cp "$APK" Noorix-debug.apk
            echo "APK built: $APK ($(du -h Noorix-debug.apk | cut -f1))"
          else
            echo "NO APK PRODUCED"
            rm -f Noorix-debug.apk
          fi
          git add -f Noorix-debug.apk ci/build-tail.log gradlew gradlew.bat gradle/wrapper/ 2>/dev/null || true
          git status --short
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "ci: build debug APK from $GITHUB_SHA"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || (sleep 10; git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}")
