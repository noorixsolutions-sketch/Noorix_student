name: Build Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # On-demand builds: lets a build be triggered from the Actions tab or
  # with `gh workflow run build-apk.yml --ref main`, without needing a new
  # commit. Useful for producing a fresh APK from the current main.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Release APK
      run: |
        set -o pipefail
        ./gradlew assembleRelease --stacktrace 2>&1 | tee noorix-build.log

    # Surfaces the compiler error lines as check-run annotations on
    # failure (workflow commands need no write token), so build
    # problems are visible from the PR page even before opening the
    # raw run log.
    - name: Annotate failure
      if: failure()
      run: |
        # First: Kotlin/KSP compiler errors ("e: ..." lines).
        grep -E '^(e:|w: \[ksp\]|error:)' noorix-build.log | head -n 18 | while IFS= read -r line || [ -n "$line" ]; do
          printf '::error file=gradlew,line=1,title=Noorix compile error::%s\n' "$line"
        done
        # Second: everything from the FAILURE marker onward
        # ("What went wrong" + "Caused by"), capped at 18 lines.
        awk '/^FAILURE: Build failed/{f=1} f' noorix-build.log | head -n 18 | while IFS= read -r line || [ -n "$line" ]; do
          printf '::error file=gradlew,line=2,title=Noorix CI error::%s\n' "$line"
        done
        # Third: the last 8 lines (stack trace context).
        tail -n 8 noorix-build.log | while IFS= read -r line || [ -n "$line" ]; do
          printf '::error file=gradlew,line=3,title=Noorix CI log tail::%s\n' "$line"
        done

    - name: Report APK details
      if: success()
      run: |
        ls -lh app/build/outputs/apk/release/*.apk
        for f in app/build/outputs/apk/release/*.apk; do
          echo "--- $f"
          if unzip -l "$f" | grep -qE 'META-INF/.*\.(RSA|DSA|EC|SF)$'; then
            echo "signed: yes"
          else
            echo "signed: no - installable only after signing (apksigner / Android Studio)"
          fi
        done

    - name: Upload Release APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        # Matches both app-release.apk (signed: keystore + env passwords
        # present) and app-release-unsigned.apk (no keystore configured,
        # e.g. public CI), so enabling signing never breaks the upload.
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
