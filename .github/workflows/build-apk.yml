name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_ARGS: --no-daemon --stacktrace

jobs:
  build:
    name: Build and test debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Noorix Debug,O=Noorix,C=NL"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          mkdir -p ci
          set -o pipefail
          ./gradlew :app:assembleDebug $GRADLE_ARGS 2>&1 | tee ci/build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest $GRADLE_ARGS 2>&1 | tee -a ci/build.log

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "No debug APK was produced"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noorix-debug-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            ci/build.log
          if-no-files-found: warn
          retention-days: 30
